<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">

<title>RF Watches Store</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f0f0f;
  color:white;
  text-align:center;
}

header{
  padding:20px;
  font-size:28px;
  font-weight:bold;
  letter-spacing:2px;
}

.products{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
}

.card{
  background:#1c1c1c;
  width:280px;
  margin:20px;
  padding:15px;
  border-radius:12px;
  transition:0.3s;
}

.card:hover{
  transform:scale(1.05);
}

img{
  width:100%;
  border-radius:10px;
}

.price{
  color:#e50914;
  font-size:20px;
  margin:10px 0;
}

button{
  background:#e50914;
  border:none;
  padding:10px;
  width:100%;
  color:white;
  border-radius:6px;
  cursor:pointer;
  font-size:16px;
}

button:hover{
  background:#ff1e2d;
}
</style>
</head>
