<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>RF Watches Store</title>
<style>
body {
  background-color: #f5f5f0;
  font-family: Arial;
  text-align: center;
}
.product {
  border: 1px solid #ddd;
  padding: 20px;
  margin: 20px;
  background: white;
}
.old-price {
  text-decoration: line-through;
  color: red;
}
.new-price {
  font-weight: bold;
  font-size: 20px;
}
button {
  background: black;
  color: white;
  padding: 10px 20px;
  border: none;
  cursor: pointer;
}
form {
  display: none;
  margin-top: 20px;
}
input, select {
  padding: 8px;
  margin: 5px;
  width: 80%;
}
</style>
</head>
<body>

<h1>RF Watches Store</h1>

<div class="product">
<h2>Rolex</h2>
<p>Available in 4 colors</p>
<p class="old-price">2700 DA</p>
<p class="new-price">2350 DA</p>
<button onclick="selectProduct('Rolex - 2350 DA')">Order</button>
</div>

<div class="product">
<h2>Festina</h2>
<p class="old-price">2200 DA</p>
<p class="new-price">1900 DA</p>
<button onclick="selectProduct('Festina - 1900 DA')">Order</button>
</div>

<div class="product">
<h2>Casio + Bague</h2>
<p class="old-price">2700 DA</p>
<p class="new-price">2200 DA</p>
<button onclick="selectProduct('Casio + Bague - 2200 DA')">Order</button>
</div>

<form id="orderForm">
<h2>Complete Your Order</h2>
<input type="text" id="name" placeholder="First Name" required><br>
<input type="text" id="lastname" placeholder="Last Name" required><br>
<input type="text" id="phone" placeholder="Phone Number" required><br>
<input type="text" id="wilaya" placeholder="Wilaya" required><br>
<input type="text" id="address" placeholder="Exact Address" required><br>
<button type="submit">Confirm Order</button>
</form>

<script>
let selectedProduct = "";

function selectProduct(product) {
  selectedProduct = product;
  document.getElementById("orderForm").style.display = "block";
  window.scrollTo(0, document.body.scrollHeight);
}

document.getElementById("orderForm").addEventListener("submit", function(e) {
  e.preventDefault();

  fetch("YOUR_GOOGLE_SCRIPT_URL", {
    method: "POST",
    body: JSON.stringify({
      product: selectedProduct,
      name: document.getElementById("name").value,
      lastname: document.getElementById("lastname").value,
      phone: document.getElementById("phone").value,
      wilaya: document.getElementById("wilaya").value,
      address: document.getElementById("address").value
    })
  }).then(res => {
    alert("Order Sent Successfully!");
    document.getElementById("orderForm").reset();
  });
});
</script>

</body>
</html>
